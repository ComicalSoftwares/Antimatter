name: PR Check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  conflict-check:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if PR is mergeable
        id: merge_check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const hasConflict = pr.data.mergeable === false;
            core.setOutput("conflict", hasConflict ? "true" : "false");

      - name: Comment and close on merge conflict
        if: steps.merge_check.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "This PR got merge conflicts so it will be closed. Please update your fork then reopen."
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: "closed"
            });

  build-linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out PR code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies and build Linux binary
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt pyinstaller
          pyinstaller --onefile --windowed --icon "AppIcon.png" --name "Antimatter" --add-data "AppIcon.ico:." --add-data "AppIcon.png:." --add-data "src/about.txt:." src/main.py